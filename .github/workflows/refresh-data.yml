name: Parkeerdata verversen

# Draait de RDW-datapijplijnen periodiek en commit de verse JSON.
# Netlify deployt automatisch bij de push.

on:
  schedule:
    - cron: "0 4 * * 1"          # elke maandag 04:00 UTC
  workflow_dispatch:             # handmatig te starten via de Actions-tab

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python beschikbaar maken
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gemeente-kaart verversen
        run: python3 scripts/build_gemeentenmap.py

      - name: Steden verversen (straat + vergunning + garages)
        run: |
          # Te bouwen steden: "areamanagerid:Gemeentenaam". Voeg hier gemeenten toe om uit te rollen.
          STEDEN=(
            "363:Amsterdam"
            "599:Rotterdam"
            "344:Utrecht"
            "518:Den Haag"
          )
          for spec in "${STEDEN[@]}"; do
            id="${spec%%:*}"; naam="${spec##*:}"
            echo "::group::Stad $id ($naam)"
            python3 scripts/build_street.py  "$id"        || echo "straat $id overgeslagen"
            python3 scripts/build_permit.py  "$id"        || echo "vergunning $id overgeslagen"
            python3 scripts/build_garages.py "$id" "$naam" || echo "garages $id overgeslagen"
            echo "::endgroup::"
          done

      - name: Wijzigingen committen
        run: |
          git config user.name  "qurb-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "Data: automatische verversing RDW-parkeerdata ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "Geen wijzigingen in de data."
          fi
