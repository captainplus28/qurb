name: Parkeerdata verversen

# UITGESCHAKELD: deze workflow hoorde bij de oude statische site (scripts/*.py
# + data/ map). Die zijn vervangen door de Next.js-rebuild (public/data/).
# Schedule staat uit zodat de Action niet meer faalt. Zet 'm pas weer aan
# zodra er een ververs-pipeline is die met public/data/ werkt.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Uitgeschakeld na Next.js-rebuild
        run: |
          echo "Deze workflow is uitgeschakeld: scripts/ en data/ bestaan niet meer sinds de Next.js-rebuild (data zit nu in public/data/)."
          echo "Bouw eerst een nieuwe ververs-pipeline voor public/data/ voordat je dit weer aanzet."
          exit 0
