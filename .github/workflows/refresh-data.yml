name: Parkeerdata verversen

# Ontdekt automatisch alle gemeenten met betaald straatparkeren en bouwt hun data.
# Commit incrementeel zodat voortgang behouden blijft, ook bij een timeout.
# Netlify deployt automatisch bij elke push.

on:
  schedule:
    - cron: "0 2 * * 1"          # elke maandag 02:00 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Alle gemeenten verversen
        run: |
          set -u
          git config user.name  "qurb-bot"
          git config user.email "actions@users.noreply.github.com"

          commit_push () {
            git add data/ || true
            git commit -m "Data: automatische verversing RDW-parkeerdata ($(date -u +%F))" || return 0
            git pull --rebase --autostash || true
            git push || true
          }

          python3 scripts/build_gemeentenmap.py
          commit_push

          python3 scripts/steden_lijst.py > /tmp/steden.tsv
          n=0
          while IFS=$'\t' read -r id naam; do
            case "$id" in ""|\#*) continue ;; esac
            echo "::group::Gemeente $id ($naam)"
            python3 scripts/build_street.py  "$id"        || echo "straat $id overgeslagen"
            python3 scripts/build_permit.py  "$id"        || echo "vergunning $id overgeslagen"
            python3 scripts/build_garages.py "$id" "$naam" || echo "garages $id overgeslagen"
            echo "::endgroup::"
            n=$((n + 1))
            [ $((n % 10)) -eq 0 ] && commit_push
          done < /tmp/steden.tsv

          commit_push
          echo "Klaar: $n gemeenten verwerkt."
